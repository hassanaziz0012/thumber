<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Thumber</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <span>Thumber</span>
    </div>
    <label class="switch" title="Enable / disable the swap">
      <input type="checkbox" id="enabled" checked>
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <main>
    <section class="card">
      <label class="thumb" id="drop" tabindex="0">
        <input type="file" id="file" accept="image/*" hidden>
        <img id="thumbImg" alt="" hidden>
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zm0-10h4v6h6v-6h4l-7-7-7 7z"/></svg>
          <strong>Drop a thumbnail</strong>
          <span>or click to browse · 16:9 PNG / JPG</span>
        </div>
        <button type="button" class="clear" id="clearImg" title="Remove image" hidden>✕</button>
      </label>
      <div class="meta">
        <div class="avatar"></div>
        <div class="lines">
          <div class="title" id="previewTitle">Your video title</div>
          <div class="sub">Your Channel · 12K views · 1 day ago</div>
        </div>
      </div>
    </section>

    <div class="field">
      <div class="field-head">
        <label for="title">Title</label>
        <span class="count" id="count">0 / 100</span>
      </div>
      <textarea id="title" rows="2" maxlength="100" placeholder="Type the title you want to test…"></textarea>
    </div>

    <div class="actions">
      <button type="button" id="shuffle" class="btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        Shuffle slot
      </button>
      <button type="button" id="reveal" class="btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        Reveal
      </button>
    </div>
  </main>

  <section class="offsite" id="offsite" hidden>
    <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M21.58 7.19a2.5 2.5 0 0 0-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42a2.5 2.5 0 0 0-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81a2.5 2.5 0 0 0 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42a2.5 2.5 0 0 0 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
    <h2>Head over to YouTube</h2>
    <p>Thumber previews your thumbnail on the YouTube home feed and search results. Switch to a YouTube tab to start testing.</p>
    <button type="button" id="openYouTube" class="btn primary">Open YouTube</button>
  </section>

  <footer id="status"><span class="dot"></span><span id="statusText">Checking tab…</span></footer>

  <script src="panel.js"></script>
</body>
</html>
